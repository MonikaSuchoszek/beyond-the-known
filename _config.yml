# External gems
# See http://ixti.net/software/2013/01/28/using-jekyll-plugins-on-github-pages.html for making `jekyll archives` work.
plugins:
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-paginate-v2
  - mini_magick

exclude:
  - "/vendor/"
  - "/.idea/"
  - "/docs/"
  - "*.bat"
  - "Gemfile*"
  - "circle.yml"
  - "LICENSE.md"
  - "README.md"
  - "pagefind.exe"
  - "pagefind.yaml"
  - "improvement_plan.md"
  - "plan.md"

destination: "./docs"

future: true

defaults:
-
    scope:
      path: "_posts/en"
      type: "posts"
    values:
      locale: "en_US"
      permalink: /en/:categories/:year/:month/:title/

-
    scope:
      path: "_posts/pl"
      type: "posts"
    values:
      locale: "pl_PL"
      permalink: /pl/:categories/:year/:month/:title/

-
    scope:
      path: "_posts/nl"
      type: "posts"
    values:
      locale: "nl_NL"
      permalink: /nl/:categories/:year/:month/:title/

languages:
-
    name: English
    icon: /assets/flag-icon-en_US.png
    locale: "en_US"
    index: "/"

-
    name: Polski
    icon: /assets/flag-icon-pl_PL.png
    locale: "pl_PL"
    index: "/pl/"

-
    name: Nederlands
    icon: /assets/flag-icon-nl_NL.png
    locale: "nl_NL"
    index: "/nl/"

# Site settings
title: Going beyond the known
subtitle: "following our dreams"
email: monika.suchoszek@gmail.com
name: Monika Suchoszek
description: A travel blog by Monika Suchoszek.
# Base URL of site (i.e. /blog). It should always start with a slash,
# and never end with a slash. Set it to a blank value if hosting at the
# root of your server.
baseurl: "" # the subpath of your site, e.g. /blog/
url: "https://www.beyond-the-known.eu" # the base hostname & protocol for your site
cover: "/assets/index_header.jpg"
logo: "/assets/logo.png"

thumbnail:
    resize_dimensions: '430x288^'
    crop_dimensions: '430x288+0+0'

gallery_items:
    resize_dimensions: '430x288^'
    crop_dimensions: '430x288+0+0'

# Open Graph / Twitter card images, generated by _plugins/social_image_generator.rb
# from each post's `cover` (and from `cover:` above for the site-wide fallback).
# 1200x630 is the size Facebook, LinkedIn and X all render without re-cropping.
social_image:
    dir: "/assets/social"
    width: 1200
    height: 630
    quality: 82

#jekyll-archives:
#  enabled:
#    - year
#  layout: 'archive'
#  permalinks:
#    year: '/year/:year/'
#  cover: "/assets/index_header.jpg"

# Build settings
markdown: kramdown

pagination:
  enabled: true
  per_page: 7
  permalink: "/page/:num/"
  sort_reverse: true

inter_post_navigation: true

# Disqus comments
# disqus_shortname: bencentra

# Google maps API key
google_maps_api_key: "AIzaSyDBP15TP4Fd7fZykz38sGIHJl0phWLUSdA"

# Category descriptions (for archive pages)
# Make sure that these are correctly handled in pagefind.yaml!
# `cat` is the slug used in post front matter and in URLs - keep it ASCII-only.
# `display` is optional and overrides the label shown to readers.
# _plugins/category_guard.rb fails the build if a post uses a category that is
# not listed here for its locale.
descriptions:
  - cat: travel
    desc: "Read all about places we visited"
    locale: "en_US"

  - cat: sports
    desc: "Hiking, Running and other things we tried"
    locale: "en_US"

  - cat: food
    desc: "Interesting cuisine that caught our attention"
    locale: "en_US"

  - cat:  podroze
    display: "Podróże"
    desc: "Wszystko o miejscach, które odwiedziliśmy"
    locale: "pl_PL"

  - cat: sport
    desc: "Bieganie, wyprawy w góry oraz inne aktywności"
    locale: "pl_PL"

  - cat: jedzenie
    desc: "Interesujące kuchnie świata, których smaku nigdy nie zapomnimy"
    locale: "pl_PL"

  - cat: reizen
    desc: "Lees alles over plaatsen die we bezochten"
    locale: "nl_NL"

  - cat: sport
    desc: "Wandelen, lopen en andere dingen die we uitprobeerden"
    locale: "nl_NL"

  - cat: eten
    desc: "Boeiende gerechten die onze aandacht trokken"
    locale: "nl_NL"

# Social icons and sharing options
#
# Social settings are used in two places:
# * In the footer, as links to your personal profiles
# * After each blog post for sharing widgets
#
# Example:
#
# social:
#   - name: Twitter                         # Name of the service
#     icon: twitter                         # Font Awesome icon to use (minus fa- prefix)
#     username: "@TheBenCentra"             # (User) Name to display in the footer link
#     url: https://twitter.com/TheBenCentra # URL of your profile (leave blank to not display in footer)
#     desc: Follow me on Twitter            # Description to display as link title, etc
#     share: true                           # Include in the "Share" section of posts
social:
  - name: Facebook
    icon: facebook
    username: monika.suchoszek
    url: https://www.facebook.com/monika.suchoszek
    desc: Friend me on Facebook
    share: true

  - name: GitHub
    icon: github
    username: MonikaSuchoszek
    url: https://github.com/MonikaSuchoszek
    desc: Fork me on GitHub
    share: false

  - name: LinkedIn
    icon: linkedin
    desc: Share on LinkedIn
    share: true

  - name: Twitter
    icon: twitter
    desc: Share on Twitter
    share: true


# Social sharing protocols
#
# fb_image is only the last-resort og:image, used if the social card generator
# produced nothing (see `social_image` above); its dimensions are the logo's own
# and are emitted only in that case.
#
# twitter_site / twitter_creator are the @handles X credits the card to. Left
# unset because the site has no X account - head.html omits the tags entirely
# rather than emitting empty ones.
protocols:
    fb_image: "/assets/logo.png"
    fb_image_width: 612
    fb_image_height: 605
    fb_image_type: "image/png"

    # twitter_site: "@handle"
    # twitter_creator: "@handle"
